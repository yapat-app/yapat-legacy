services:
  yapat:
    build: .
    ports:
      - "${PORT:-1050}:1050"
    volumes:
      - ./instance:/app/instance
      - ./projects:/app/projects
      - ${AUDIO_STORAGE_PATH:-./data/audio}:/app/data/audio
      - ${EMBEDDINGS_STORAGE_PATH:-./data/embeddings}:/app/data/embeddings
      - ./results:/app/results
      - ${MODEL_PATH:-./models}:/app/models
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=1050
      - DEBUG=false
      - DEV_TOOLS_PROPS_CHECK=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
